<title>Smash Fit – ฟิตเนสนักแบด</title>

<script>/* ใช้ธีม สีหลัก และขนาดตัวอักษรที่ผู้ใช้เลือกก่อนวาดหน้า (ไม่กระพริบ) */try{var s=(JSON.parse(localStorage.getItem('smashfit.v1'))||{}).settings||{},r=document.documentElement;if(s.theme==='light'||s.theme==='dark')r.dataset.theme=s.theme;if(s.accent&&s.accent!=='green')r.dataset.accent=s.accent;if(s.textSize==1.1||s.textSize==1.2)r.style.setProperty('--tz',s.textSize)}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light dark;
  --bg:#f2f2f7;--cell:#fff;--cell-hi:#fff;--fill:rgba(118,118,128,.12);--fill2:rgba(118,118,128,.2);--sep:rgba(60,60,67,.2);
  --tx:#000;--tx2:#636366;
  --ac:#18794e;--ac-tx:#fff;--ac-soft:rgba(24,121,78,.12);--ac-ink:#18794e;
  --game:#0060df;--game-soft:rgba(0,96,223,.14);
  --warn:#a64b00;--warn-soft:rgba(255,149,0,.15);--bad:#c4001a;--bad-soft:rgba(255,59,48,.12);
  --seg-on:#fff;--seg-sh:0 1px 3px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04);
  --sheet-sh:0 -8px 40px rgba(0,0,0,.12);
  --fig-near:#1c1c1e;--fig-far:#9a9aa0;--fig-db:#18794e;--fig-rk:#0060df;--fig-gr:#c7c7cc;--fig-pr:#d1d1d6;--fig-bg:#fff;
  --r:12px;--ease:cubic-bezier(.22,1,.36,1);
  --font:-apple-system,BlinkMacSystemFont,"Noto Sans Thai","Segoe UI","Leelawadee UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000;--cell:#1c1c1e;--cell-hi:#2c2c2e;--fill:rgba(118,118,128,.24);--fill2:rgba(118,118,128,.36);--sep:rgba(84,84,88,.65);
  --tx:#fff;--tx2:#98989f;
  --ac:#30d158;--ac-tx:#00210d;--ac-soft:rgba(48,209,88,.16);--ac-ink:#30d158;
  --game:#409cff;--game-soft:rgba(64,156,255,.2);
  --warn:#ffb340;--warn-soft:rgba(255,179,64,.16);--bad:#ff6961;--bad-soft:rgba(255,105,97,.16);--bad-tx:#2b0000;
  --seg-on:#636366;--seg-sh:none;--sheet-sh:none;
  --fig-near:#f2f2f7;--fig-far:#8e8e93;--fig-db:#30d158;--fig-rk:#409cff;--fig-gr:#3a3a3c;--fig-pr:#48484a;--fig-bg:#1c1c1e;
}}
:root[data-theme="dark"]{
  --bg:#000;--cell:#1c1c1e;--cell-hi:#2c2c2e;--fill:rgba(118,118,128,.24);--fill2:rgba(118,118,128,.36);--sep:rgba(84,84,88,.65);
  --tx:#fff;--tx2:#98989f;
  --ac:#30d158;--ac-tx:#00210d;--ac-soft:rgba(48,209,88,.16);--ac-ink:#30d158;
  --game:#409cff;--game-soft:rgba(64,156,255,.2);
  --warn:#ffb340;--warn-soft:rgba(255,179,64,.16);--bad:#ff6961;--bad-soft:rgba(255,105,97,.16);--bad-tx:#2b0000;
  --seg-on:#636366;--seg-sh:none;--sheet-sh:none;
  --fig-near:#f2f2f7;--fig-far:#8e8e93;--fig-db:#30d158;--fig-rk:#409cff;--fig-gr:#3a3a3c;--fig-pr:#48484a;--fig-bg:#1c1c1e;
}
/* ===== สีหลักที่ผู้ใช้เลือก (ค่าเริ่มต้น = เขียวสนาม) ===== */
:root[data-accent="blue"]{--ac:#0060df;--ac-tx:#fff;--ac-soft:rgba(0,96,223,.12);--ac-ink:#0060df;--fig-db:#0060df;--game:#7a3fd1;--game-soft:rgba(122,63,209,.14)}
:root[data-accent="orange"]{--ac:#b34700;--ac-tx:#fff;--ac-soft:rgba(179,71,0,.12);--ac-ink:#b34700;--fig-db:#b34700}
:root[data-accent="purple"]{--ac:#7a3fd1;--ac-tx:#fff;--ac-soft:rgba(122,63,209,.12);--ac-ink:#7a3fd1;--fig-db:#7a3fd1}
:root[data-accent="pink"]{--ac:#c2185b;--ac-tx:#fff;--ac-soft:rgba(194,24,91,.12);--ac-ink:#c2185b;--fig-db:#c2185b}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"])[data-accent="blue"]{--ac:#409cff;--ac-tx:#001a3d;--ac-soft:rgba(64,156,255,.18);--ac-ink:#409cff;--fig-db:#409cff;--game:#bf5af2;--game-soft:rgba(191,90,242,.2)}
  :root:not([data-theme="light"])[data-accent="orange"]{--ac:#ff9f0a;--ac-tx:#2b1600;--ac-soft:rgba(255,159,10,.18);--ac-ink:#ff9f0a;--fig-db:#ff9f0a}
  :root:not([data-theme="light"])[data-accent="purple"]{--ac:#bf5af2;--ac-tx:#1f0430;--ac-soft:rgba(191,90,242,.2);--ac-ink:#bf5af2;--fig-db:#bf5af2}
  :root:not([data-theme="light"])[data-accent="pink"]{--ac:#ff6482;--ac-tx:#3a0010;--ac-soft:rgba(255,100,130,.18);--ac-ink:#ff6482;--fig-db:#ff6482}
}
:root[data-theme="dark"][data-accent="blue"]{--ac:#409cff;--ac-tx:#001a3d;--ac-soft:rgba(64,156,255,.18);--ac-ink:#409cff;--fig-db:#409cff;--game:#bf5af2;--game-soft:rgba(191,90,242,.2)}
:root[data-theme="dark"][data-accent="orange"]{--ac:#ff9f0a;--ac-tx:#2b1600;--ac-soft:rgba(255,159,10,.18);--ac-ink:#ff9f0a;--fig-db:#ff9f0a}
:root[data-theme="dark"][data-accent="purple"]{--ac:#bf5af2;--ac-tx:#1f0430;--ac-soft:rgba(191,90,242,.2);--ac-ink:#bf5af2;--fig-db:#bf5af2}
:root[data-theme="dark"][data-accent="pink"]{--ac:#ff6482;--ac-tx:#3a0010;--ac-soft:rgba(255,100,130,.18);--ac-ink:#ff6482;--fig-db:#ff6482}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx)}
body{zoom:var(--tz,1);font-family:var(--font);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);caret-color:var(--ac)}
body.lock{overflow:hidden}
::selection{background:var(--ac-soft)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:8px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
h1,h2,h3,p{margin:0}
.num{font-variant-numeric:tabular-nums}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i .fill{fill:currentColor;stroke:none}
main{max-width:600px;margin:0 auto;padding:0 16px calc(120px + env(safe-area-inset-bottom))}

/* ===== large title ===== */
.lt{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:14px 4px 12px}
.lt h1{font-size:34px;line-height:1.2;font-weight:700;letter-spacing:-.02em}
.lt .sub{color:var(--tx2);font-size:15px;margin-top:2px;display:flex;align-items:center;gap:2px;flex-wrap:wrap}
.lt-aux{padding-bottom:6px}

/* ===== grouped lists ===== */
.grp{background:var(--cell);border-radius:var(--r);overflow:hidden;margin:0 0 24px}
.sec{font-size:13px;font-weight:400;color:var(--tx2);padding:0 16px 7px;margin-top:-4px}
.foot{font-size:13px;color:var(--tx2);padding:0 16px;margin:-16px 0 24px;line-height:1.55}
.foot ul{margin:4px 0 0;padding-left:18px}.foot li{margin:3px 0}
.row{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:50px;padding:10px 16px;text-align:left;color:var(--tx)}
.row+.row::before,.row+.rowx::before,.rowx+.row::before{content:"";position:absolute;top:0;right:0;left:var(--inset,16px);border-top:.5px solid var(--sep)}
.row.has-i{--inset:50px}
.row:has(.thumb){--inset:96px}
button.row:active,label.row:active{background:var(--fill)}
.row-i{color:var(--tx2)}
.row-t{flex:1;min-width:0;display:flex;flex-direction:column}
.row-t b{font-weight:600}
.row-t small{font-size:14px;color:var(--tx2);line-height:1.4}
.row-v{color:var(--tx2);font-size:16px;text-align:right;white-space:nowrap;max-width:55%;overflow:hidden;text-overflow:ellipsis}
.chev{width:16px;height:16px;color:var(--tx2);opacity:.6;stroke-width:2.4}
.row.sel{cursor:pointer}
.row.sel select{position:absolute;inset:0;opacity:0;width:100%;height:100%;font-size:16px;cursor:pointer}
.row-in{flex:0 1 50%;min-width:0;text-align:right;background:none;border:0;color:var(--tx);font:inherit;font-size:17px;padding:4px 0}
.row-in::placeholder{color:var(--tx2)}
.row-in[type=date]{flex:0 0 auto;width:auto;color:var(--tx);-webkit-appearance:none;appearance:none;min-height:34px;background:var(--fill);border-radius:8px;padding:4px 10px;font-size:16px}
.row.sel:focus-within{outline:2px solid var(--ac);outline-offset:-2px;border-radius:var(--r)}
.focus:focus{outline:none}
.row.danger{color:var(--bad);justify-content:center;font-weight:500}
.row.link .row-t{color:var(--ac-ink)}
.rowx{position:relative;padding:12px 16px}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--tx2);margin-top:9px;align-self:flex-start}
.n-good .dot{background:var(--ac)}.n-warn .dot{background:var(--warn)}.n-bad .dot{background:var(--bad)}
.n-bad .row-t{color:var(--bad)}

/* ===== buttons ===== */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;padding:12px 18px;border-radius:var(--r);background:var(--ac);color:var(--ac-tx);font-size:17px;font-weight:600;text-decoration:none;transition:transform .15s var(--ease),opacity .15s}
.btn:active{transform:scale(.98);opacity:.85}
.btn.tint{background:var(--ac-soft);color:var(--ac-ink)}
.btn.plain{background:var(--fill);color:var(--tx)}
.btn.red{background:var(--bad);color:var(--bad-tx,#fff)}
.brow{display:flex;gap:10px}
.brow .btn.red{flex:0 0 auto;width:auto;padding-left:18px;padding-right:20px}
.brow .btn:not(.red){flex:1;white-space:nowrap}
.f-timer .acts .btn{white-space:nowrap;padding-left:8px;padding-right:8px}
.f-timer.paused .ft{color:var(--tx2)}
.f-timer.paused .fb i{background:var(--tx2)}
.timer .btn.sm{min-width:52px;padding:6px 10px}
.btn.sm{width:auto;min-height:36px;padding:6px 14px;font-size:15px;border-radius:999px}
.btn[disabled]{opacity:.45;pointer-events:none}
.tip{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;margin:-6px -4px -6px 0;color:var(--ac-ink);vertical-align:middle}
.tip svg.i{width:17px;height:17px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;background:var(--fill);font-size:13px;color:var(--tx2)}

/* ===== segmented ===== */
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{flex:1;min-height:36px;border-radius:7px;font-size:15px;color:var(--tx);white-space:nowrap;transition:background .2s var(--ease)}
.seg button.on{background:var(--seg-on);box-shadow:var(--seg-sh);font-weight:600}
.seg.five button{min-height:44px;font-size:17px}
.rpe{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.rpe button{min-height:46px;border-radius:10px;background:var(--fill);font-size:17px}
.rpe button.on{background:var(--ac);color:var(--ac-tx);font-weight:700}

/* ===== week strip ===== */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:0 0 16px}
.wd{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 8px;border-radius:14px;color:var(--tx)}
.wd-n{font-size:12px;color:var(--tx2)}
.wd-d{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;font-size:17px;font-weight:500}
.wd.td .wd-d{color:var(--ac-ink);font-weight:700}
.wd.on .wd-d{background:var(--tx);color:var(--bg);font-weight:700}
.wd.on.td .wd-d{background:var(--ac);color:var(--ac-tx)}
.wd-i{width:18px;height:18px;color:var(--tx2);stroke-width:1.7}
.wd-dot{width:5px;height:5px;border-radius:50%}
.wd-dot.f{background:var(--ac)}

/* ===== logbook tally ===== */
.tally{display:flex;flex-wrap:wrap;gap:6px 9px;align-items:center}
.tg{display:inline-flex;gap:3px}
.tally i{width:11px;height:11px;border-radius:3px;background:var(--fill2);display:block;transition:background .3s var(--ease)}
.tally i.f{background:var(--ac)}
.tally.sm{flex-wrap:nowrap;gap:3px;flex:none}
.tally.sm i{width:8px;height:8px;border-radius:2px}
.tally.lg{gap:8px;justify-content:center}.tally.lg i{width:26px;height:26px;border-radius:7px}

/* ===== hero ===== */
.hero{padding:18px 16px 16px}
.hero-h{display:flex;gap:14px;align-items:flex-start}
.hero-i{width:30px;height:30px;color:var(--ac-ink);margin-top:3px;stroke-width:1.7}
.hero h2{font-size:24px;line-height:1.3;font-weight:700;letter-spacing:-.01em}
.meta{font-size:15px;color:var(--tx2)}
.hero .tally{margin:16px 0 8px}
.hero .prog{font-size:13px;color:var(--tx2);margin-bottom:14px}
.hero-ctl{border-top:.5px solid var(--sep);margin:16px -16px -16px;padding:0}
.hero-ctl .rowx{padding:12px 16px}
.lbl{font-size:13px;color:var(--tx2);margin-bottom:6px}
.ex-row .row-t b{font-size:16px}
.thumb{width:68px;height:54px;flex:none;border-radius:10px;background:var(--fill);overflow:hidden;color:var(--tx)}
.thumb svg{width:100%;height:100%;display:block}
.tag{font-size:13px;color:var(--warn)}
.done-row .row-t b{color:var(--tx2)}

/* ===== forms ===== */
.field{display:flex;flex-direction:column;gap:6px;padding:12px 16px;position:relative}
.field+.field::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.in,select.in,textarea.in{width:100%;background:var(--fill);border:0;border-radius:10px;color:var(--tx);font:inherit;font-size:17px;padding:10px 12px}
textarea.in{min-height:80px;font-size:16px}
.in::placeholder{color:var(--tx2)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -16px 6px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:6px 14px;border-radius:999px;background:var(--cell);font-size:15px;color:var(--tx);white-space:nowrap}
.chip.on{background:var(--tx);color:var(--bg);font-weight:600}
.wrap{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
.wrap .chip{background:var(--fill)}
.wrap .chip.on{background:var(--ac);color:var(--ac-tx)}
.search{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:10px;padding:0 10px;margin:0 0 12px;color:var(--tx2)}
.search input{flex:1;background:none;border:0;color:var(--tx);font:inherit;font-size:17px;padding:9px 0;min-width:0}
.search input::placeholder{color:var(--tx2)}
.chk{display:flex;gap:12px;align-items:center}
input[type=checkbox].sw{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:999px;background:var(--fill2);position:relative;flex:none;transition:background .2s;margin:0;cursor:pointer}
input[type=checkbox].sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .25s var(--ease)}
input[type=checkbox].sw:checked{background:var(--ac)}
input[type=checkbox].sw:checked::after{transform:translateX(20px)}

/* ===== tab bar ===== */
.tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--cell);background:color-mix(in srgb,var(--cell) 82%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);z-index:20}
.tabbar .in{display:flex;max-width:600px;margin:0 auto;padding:6px 4px calc(4px + env(safe-area-inset-bottom))}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:500;color:var(--tx2);padding:2px 0;min-height:48px}
.tabbar button svg.i{width:26px;height:26px;stroke-width:1.7}
.tabbar button[aria-current="page"]{color:var(--ac-ink)}

/* ===== rest pill (outside focus) ===== */
.timer{position:fixed;left:16px;right:16px;bottom:calc(70px + env(safe-area-inset-bottom));max-width:568px;margin:0 auto;display:none;align-items:center;gap:12px;padding:10px 10px 10px 16px;border-radius:16px;background:var(--cell-hi);box-shadow:var(--sheet-sh),0 0 0 .5px var(--sep);z-index:30}
.timer.show{display:flex}
body.lock .timer,body:not(.v-today) .timer{display:none}
.timer .tt{font-size:28px;font-weight:600}
.timer .tl{font-size:13px;color:var(--tx2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer .tb{position:absolute;left:16px;right:16px;bottom:5px;height:3px;border-radius:2px;background:var(--fill);overflow:hidden}
.timer .tb i{display:block;height:100%;background:var(--ac);width:0}

/* ===== sheets ===== */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;z-index:60}
.modal.show{display:flex;animation:fade .25s var(--ease)}
.sheet{background:var(--bg);width:100%;max-width:600px;margin:0 auto;border-radius:14px 14px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));max-height:calc(92vh / var(--tz,1));overflow:auto;box-shadow:var(--sheet-sh);animation:up .35s var(--ease);overscroll-behavior:contain}
.sheet:focus{outline:none}
.grab{width:36px;height:5px;border-radius:3px;background:var(--fill2);margin:0 auto 10px}
.shh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.shh h2{font-size:22px;font-weight:700;line-height:1.3}
.shh .x{min-height:36px;padding:6px 14px;border-radius:999px;background:var(--fill);font-size:15px;font-weight:600;flex:none}
.sheet .note{font-size:15px;color:var(--tx2);margin:8px 4px 14px}
.anim{width:100%;height:220px;background:var(--cell);border-radius:var(--r);display:block;margin:0 0 16px}
.sheet h3{font-size:17px;font-weight:600;margin:20px 4px 6px}
.sheet ol,.sheet ul.l{margin:0;padding:12px 16px 12px 36px;background:var(--cell);border-radius:var(--r);font-size:16px}
.sheet li{margin:4px 0}

// ---------- คำนวณ ----------
function ik(A,B,l1,l2,s){
  const dx=B[0]-A[0],dy=B[1]-A[1];let d=Math.hypot(dx,dy)||1e-6;const ux=dx/d,uy=dy/d;
  d=Math.min(Math.max(d,Math.abs(l1-l2)+.01),l1+l2-.01);
  const a=(l1*l1-l2*l2+d*d)/(2*d),h=Math.sqrt(Math.max(0,l1*l1-a*a));
  return [[A[0]+a*ux+s*h*(-uy),A[1]+a*uy+s*h*ux],[A[0]+d*ux,A[1]+d*uy]];
}
const add=(p,q)=>[p[0]+q[0],p[1]+q[1]];
function lerp(a,b,t){if(a==null)return b;if(b==null)return a;if(typeof a==='number')return a+(b-a)*t;return a.map((x,i)=>lerp(x,b[i],t))}
const LK=['hip','t','tl','hd','a','h','f','e','he','k','ha','do','rod'];
function full(ex,p){return Object.assign(base(ex.v),p)}
function poseAt(ex,time){
  const F=ex.k.map(p=>full(ex,p)),n=F.length,d=ex.d||.8,hold=ex.hold==null?.25:ex.hold;
  const seq=ex.m==='loop'||n<2?F.map((_,i)=>i):[...F.map((_,i)=>i),...F.slice(1,-1).map((_,i)=>n-2-i)];
  const seg=d+hold,tot=seg*seq.length;let u=((time%tot)+tot)%tot;const i=Math.floor(u/seg);u-=i*seg;
  const A=F[seq[i]],B=F[seq[(i+1)%seq.length]];
  let t=u<hold?0:(u-hold)/d;t=.5-.5*Math.cos(Math.PI*t);
  const o={};LK.forEach(k=>o[k]=lerp(A[k],B[k],t));o.kb=(t<.5?A:B).kb;o.eb=(t<.5?A:B).eb;return o;
}
function solve(ex,p){
  const fr=ex.v==='front',tr=p.t*R,hip=p.hip,S=add(hip,[L.T*p.tl*Math.sin(tr),L.T*p.tl*Math.cos(tr)]);
  const px=[Math.cos(tr),-Math.sin(tr)];
  const sh=fr?[add(S,[12*px[0],12*px[1]]),add(S,[-12*px[0],-12*px[1]])]:[S,S];
  const hp=fr?[add(hip,[8*px[0],8*px[1]]),add(hip,[-8*px[0],-8*px[1]])]:[hip,hip];
  const ha=(tr+p.hd*R),head=add(S,[(L.N+L.HR)*Math.sin(ha),(L.N+L.HR)*Math.cos(ha)]);
  const legs=[0,1].map(i=>{let K,A;
    if(p.k&&p.k[i]){K=add(hp[i],p.k[i]);A=p.a[i]}else{[K,A]=ik(hp[i],p.a[i],L.TH,L.SH,p.kb[i])}
    const f=p.f[i]*R;let T,H;
    if(fr){const s=i?-1:1;T=add(A,[s*7,-3]);H=add(A,[-s*1,-3])}else{T=add(A,[L.FT*Math.cos(f),-L.FT*Math.sin(f)]);H=add(A,[-3*Math.cos(f),3*Math.sin(f)])}
    return {H:hp[i],K,A,T,Hl:H}});
  const arms=[0,1].map(i=>{let E,W;
    if(p.e&&p.e[i]){E=add(sh[i],p.e[i]);W=add(E,p.he[i])}
    else{const tg=p.ha?p.ha:add(sh[i],p.h[i]);[E,W]=ik(sh[i],tg,L.UA,L.FA,p.eb[i])}
    const D=p.do&&p.do[i]?add(W,p.do[i]):null,Rd=p.rod&&p.rod[i]?add(W,p.rod[i]):null;
    return {S:sh[i],E,W,D,Rd}});
  return {hip,S,head,legs,arms,fr,hp,sh};
}

// ---------- วาด ----------
const f1=v=>Math.round(v*10)/10;
const ln=(a,b,c,w)=>`<line x1="${f1(a[0])}" y1="${f1(-a[1])}" x2="${f1(b[0])}" y2="${f1(-b[1])}" style="stroke:${c}" stroke-width="${w}" stroke-linecap="round"/>`;
const dot=(a,r,c,s)=>`<circle cx="${f1(a[0])}" cy="${f1(-a[1])}" r="${r}" style="fill:${c}${s?`;stroke:${s};stroke-width:2`:''}"/>`;
function dbAt(p,fr,horiz){if(fr||horiz){return ln([p[0]-11,p[1]],[p[0]+11,p[1]],C.db,4)+`<rect x="${f1(p[0]-15)}" y="${f1(-p[1]-6)}" width="6" height="12" rx="2" style="fill:${C.db}"/><rect x="${f1(p[0]+9)}" y="${f1(-p[1]-6)}" width="6" height="12" rx="2" style="fill:${C.db}"/>`}return dot(p,7.5,C.db,'var(--fig-bg)')}
function prop(q){
  if(q.c==='wall')return `<rect x="${q.x}" y="-230" width="8" height="230" style="fill:${C.pr}"/>`;
  if(q.c==='step')return `<rect x="${q.x}" y="${-q.h}" width="${q.w}" height="${q.h}" rx="2" style="fill:${C.pr}"/>`;
  if(q.c==='chair')return `<rect x="${q.x}" y="${-q.h}" width="${q.w}" height="6" rx="2" style="fill:${C.pr}"/><rect x="${q.x+2}" y="${-q.h}" width="4" height="${q.h}" style="fill:${C.pr}"/><rect x="${q.x+q.w-6}" y="${-q.h}" width="4" height="${q.h}" style="fill:${C.pr}"/>`;
  return '';
}
function draw(ex,s){
  let o='';const fr=s.fr;
  const limbL=(g,c)=>ln(g.H,g.K,c,9)+ln(g.K,g.A,c,8)+ln(g.Hl,g.T,c,6);
  const limbA=(g,c)=>ln(g.S,g.E,c,8)+ln(g.E,g.W,c,7)+(g.D?ln(g.W,g.D,c,5):'');
  const nearC=C.near,farC=fr?C.near:C.far;
  o+=limbL(s.legs[1],farC)+limbA(s.arms[1],farC);
  if(fr){o+=ln(s.hp[0],s.hp[1],C.near,11)+ln(s.sh[0],s.sh[1],C.near,11)}
  o+=ln(s.hip,s.S,C.near,fr?20:13);
  o+=dot(s.head,L.HR,C.near);
  o+=limbL(s.legs[0],nearC)+limbA(s.arms[0],nearC);
  const db=ex.db,hands=s.arms.map(g=>g.D||g.W);
  if(db==='b'){o+=dbAt(hands[1],fr)+dbAt(hands[0],fr)}
  else if(db==='n')o+=dbAt(hands[0],fr);
  else if(db==='f')o+=dbAt(hands[1],fr);
  else if(db==='g')o+=dbAt(fr?[(hands[0][0]+hands[1][0])/2,(hands[0][1]+hands[1][1])/2]:hands[0],false);
  s.arms.forEach(g=>{if(g.Rd)o+=ln(g.W,g.Rd,C.db,4)+dot(g.Rd,6,C.db)});
  if(ex.rk){const g=s.arms[0],dx=g.W[0]-g.E[0],dy=g.W[1]-g.E[1],m=Math.hypot(dx,dy)||1,u=[dx/m,dy/m];
    const e1=add(g.W,[u[0]*20,u[1]*20]),c=add(g.W,[u[0]*34,u[1]*34]),ang=Math.atan2(-u[1],u[0])/R;
    o+=ln(g.W,e1,C.rk,3)+`<ellipse cx="${f1(c[0])}" cy="${f1(-c[1])}" rx="14" ry="9" transform="rotate(${f1(ang)} ${f1(c[0])} ${f1(-c[1])})" style="fill:none;stroke:${C.rk}" stroke-width="3"/>`}
  return o;
}
function bounds(ex){
  let x0=1e9,x1=-1e9,y1=0;const n=ex.k.length*(ex.m==='loop'?1:2)*((ex.d||.8)+(ex.hold==null?.25:ex.hold));
  for(let i=0;i<=24;i++){const s=solve(ex,poseAt(ex,n*i/24));
    const pts=[s.head,s.S,s.hip,...s.legs.flatMap(g=>[g.K,g.A,g.T]),...s.arms.flatMap(g=>[g.E,g.W,g.D,g.Rd].filter(Boolean))];
    pts.forEach(p=>{x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1])});
    x0=Math.min(x0,s.head[0]-L.HR);x1=Math.max(x1,s.head[0]+L.HR);y1=Math.max(y1,s.head[1]+L.HR);
    if(ex.rk){x0-=0;}
  }
  (ex.props||[]).forEach(q=>{x0=Math.min(x0,q.x);x1=Math.max(x1,q.x+(q.w||8))});
  const pad=ex.rk?42:16;x0-=pad;x1+=pad;const top=y1+(ex.rk?40:14);
  let w=x1-x0,h=top+12;if(w<h*1.25){const c=(x0+x1)/2;w=h*1.25;x0=c-w/2}else{h=w/1.25}
  return {x:x0,y:-(h-12),w,h};
}
const cache={};
function vb(id){const ex=P[id];if(!cache[id])cache[id]=bounds(ex);return cache[id]}
function frame(id,time){
  const ex=P[id];if(!ex)return '';const b=vb(id),s=solve(ex,poseAt(ex,time));
  return `<line x1="${f1(b.x)}" y1="0" x2="${f1(b.x+b.w)}" y2="0" style="stroke:${C.gr}" stroke-width="2"/>`+
    (ex.props||[]).map(prop).join('')+`<ellipse cx="${f1(s.hip[0])}" cy="2" rx="28" ry="3" fill="#000" opacity=".25"/>`+draw(ex,s);
}
function svg(id,time,cls){const b=vb(id);return `<svg class="${cls||''}" viewBox="${f1(b.x)} ${f1(b.y)} ${f1(b.w)} ${f1(b.h)}" xmlns="http://www.w3.org/2000/svg">${frame(id,time||0)}</svg>`}
function play(el,id){
  if(!P[id])return {stop(){}};const b=vb(id);let on=true,t0=null;
  el.setAttribute('viewBox',`${f1(b.x)} ${f1(b.y)} ${f1(b.w)} ${f1(b.h)}`);
  const loop=ts=>{if(!on)return;if(t0==null)t0=ts;el.innerHTML=frame(id,(ts-t0)/1000);requestAnimationFrame(loop)};
  requestAnimationFrame(loop);return {stop(){on=false}};
}
function thumbT(id){const ex=P[id];if(!ex)return 0;const d=ex.d||.8,h=ex.hold==null?.25:ex.hold;return h+d+.01}
return {P,svg,frame,play,has:id=>!!P[id],thumbT};
})();
if(typeof module!=='undefined')module.exports=FIG;

/* คำอธิบายละเอียดของแต่ละท่า

function mk(ctx){
  const lv=ctx.level;
  const S=id=>{let s=ctx.P.sets; if(lv==='beg')s=Math.min(3,s); if(lv==='adv'&&ctx.ph!==3)s+=1; return {id,sets:s,v:ctx.P.lo,hi:ctx.P.hi,rir:ctx.P.rir,rest:ctx.P.rest,db:1}};
  const P=(id,v)=>({id,sets:Math.max(2,3+(ctx.ph===2?1:0)-(ctx.ph===3?1:0)),v,rest:75});
  const R=(id,sec,rest=40)=>({id,sets:ctx.P.rounds+(lv==='adv'?1:0),v:sec+ctx.P.plus,rest});
  return {S,P,R};
}

<script>

let state;

(function(){const lim=addD(today(),-14);for(const k in state.drafts){if(k.split('|')[0]<lim)delete state.drafts[k]}

/* ================= ตัวช่วยคำนวณ ================= */
const typeOf=date=>{const dow=pd(date).getDay();if(dow===GAME_DOW)return 'game';return state.overrides[date]||state.week[dow]||'rest'};
function phaseIdx(date){const w=Math.floor(dayDiff(mon(state.settings.start),mon(date))/7);return (((w%4)+4)%4)||0}
const weekLoad=wk=>state.logs.filter(l=>mon(l.date)===wk).reduce((a,l)=>a+(l.load||0),0);
function acwr(date){const wk=mon(date),c=weekLoad(wk);const prev=[1,2,3].map(i=>weekLoad(addD(wk,-7*i))).filter(x=>x>0);if(prev.length<2)return null;const avg=prev.reduce((a,b)=>a+b,0)/prev.length;return {ratio:c/avg,cur:c,avg}}
const sleepScore=h=>h>=8?5:h>=7?4:h>=6?3:h>=5?2:1;
function readiness(date){const c=state.checkins[date];if(!c||!c.sleep||!c.energy||!c.sore)return null;return {score:c.sleep+c.energy+(6-c.sore)}}
function rhrBase(date){const v=[];for(let i=1;i<=14;i++){const h=state.health[addD(date,-i)];if(h&&h.rhr)v.push(h.rhr)}return v.length>=3?v.reduce((a,b)=>a+b,0)/v.length:null}

function activePain(date){
  const out={};
  for(const a in AREAS){for(let i=0;i<=10;i++){const p=state.pain[addD(date,-i)];if(p&&p[a]!=null){if(p[a]>0)out[a]=p[a];break}}}
  return out;
}
const riskAreas=(id,pain,min=3)=>Object.keys(pain).filter(a=>pain[a]>=min&&RISK[a].includes(id));
function ctxAdjust(date,type){
  const T=TYPES[type],dow=pd(date).getDay(),o={mult:1,noPlyo:false,notes:[]};
  if(!T||!T.legs||T.load<2||type==='game')return o;
  const to=(GAME_DOW-dow+7)%7,af=(dow-GAME_DOW+7)%7;
  if(to===1){o.mult*=.5;o.noPlyo=true;o.notes.push('พรุ่งนี้ตีเกม 🏸 ลดปริมาณครึ่งหนึ่ง ตัดท่ากระโดด ใช้น้ำหนักเบา ให้ขาสดในวันศุกร์')}
  else if(to===2&&T.load>=3){o.mult*=.8;o.notes.push('อีก 2 วันตีเกม — ลดปริมาณงานขา 20%')}
  if(af===1){o.mult*=.7;o.notes.push('เมื่อวานตีเกม ขายังล้า — ลด 30% (ถ้าปวดมากเปลี่ยนเป็นยืดเหยียด)')}
  else{const pt=typeOf(addD(date,-1));if(pt!=='game'&&TYPES[pt]&&TYPES[pt].legs&&TYPES[pt].load>=3&&T.load>=3){o.mult*=.85;o.notes.push(`เมื่อวานเล่นขาหนัก (${TYPES[pt].n}) — ลด 15%`)}}
  return o;
}
function subst(it,alt,ctx){
  const n={...it,id:alt,orig:it.orig||it.id},fo=EX[it.id][2],fn=EX[alt][2];
  if(!!fo.t!==!!fn.t){n.v=fn.t?30:10;delete n.hi;delete n.rir}
  if(fn.db&&!it.db)Object.assign(n,{db:1,v:ctx.P.lo,hi:ctx.P.hi,rir:ctx.P.rir,rest:ctx.P.rest});
  if(!fn.db&&it.db){delete n.db;delete n.hi;delete n.rir;n.v=fn.t?30:12}

}
function estSec(it){const f=EX[it.id][2],reps=it.hi?(it.v+it.hi)/2:it.v;let w=f.t?it.v:reps*(it.db?4:3);if(f.u)w*=2;return it.sets*(w+(it.rest||0))+15}
const estMin=blocks=>Math.round(blocks.reduce((a,b)=>a+b.items.reduce((x,it)=>x+estSec(it),0),0)/60);
function trimTo(blocks,B){
  const est=()=>estMin(blocks);let guard=200;
  const items=pr=>blocks.flatMap(b=>(b.pr||(b.fixed?0:1))===pr?b.items.map(it=>({b,it})):[]);

    const p3=items(3);if(p3.length){const x=p3[p3.length-1];x.b.items.pop();continue}
    const fx=blocks.find(b=>b.fixed&&b.items.length>(b===blocks[0]?3:1));if(fx){fx.items.pop();continue}
    const r2=items(2).filter(x=>x.it.sets>1).sort((a,b)=>b.it.sets-a.it.sets)[0];if(r2){r2.it.sets--;continue}
    const d2=items(2);if(d2.length){const x=d2[d2.length-1];x.b.items.splice(x.b.items.indexOf(x.it),1);continue}
    const r1=items(1).filter(x=>x.it.sets>2).sort((a,b)=>b.it.sets-a.it.sets)[0];if(r1){r1.it.sets--;continue}

function buildSession(date,forced){

  const ctx={ph,P,level:state.settings.level};

    if(hi.length)s.notes.push({t:`⚠️ ปวด${hi.map(a=>AREAS[a]).join(', ')} ระดับสูง — พักส่วนนี้ ถ้าไม่ดีขึ้นใน 1–2 สัปดาห์ หรือบวม/ชา ควรพบแพทย์หรือนักกายภาพ`,bad:1});}

    blocks=blocks.map(b=>{if(b.fixed)return b;let items=b.items.filter(i=>{if(s._noP&&EX[i.id][2].p){removed++;return false}return true});items=items.map(i=>({...i,sets:Math.max(1,Math.round(i.sets*mult))}));return {...b,items}}).filter(b=>b.items.length);
    if(removed)s.notes.push({t:`ตัดท่ากระโดดออก ${removed} ท่า`});
    if(mult<.999)s.notes.push({t:`ปริมาณรวมวันนี้ ≈ ${Math.round(mult*100)}% ของปกติ`});
  }
  // จำกัดเวลา
  const B=state.budget[date];
  if(B&&type!=='game'){const before=estMin(blocks);if(before>B){blocks=trimTo(blocks,B);s.notes.push({t:`⏱ ปรับให้พอดี ${B} นาที (จาก ~${before} นาที) — เก็บท่าหลักไว้ ตัดท่าเสริมก่อน`})}}
  s.blocks=blocks;s.est=estMin(blocks);
  return s;
}

/* ================= น้ำหนักดัมเบล (Double progression) ================= */
const dbList=()=>String(state.settings.dumbbells||'').split(/[\s,]+/).map(Number).filter(x=>x>0).sort((a,b)=>a-b);
const upW=w=>{const n=dbList().find(x=>x>w);return n??w};
const downW=x=>{const l=dbList();let r=l[0]||x;for(const v of l)if(v<=x)r=v;return r};
function suggestW(id,ph,it){
  const lw=state.lastW[id];if(!lw||!lw.w)return null;
  const lo=it?it.v:8,hi=it&&it.hi?it.hi:lo;
  let w=lw.w,why=`ใช้น้ำหนักเดิม พยายามเพิ่มทีละ 1 ครั้งจนทำได้ ${hi} ครั้งทุกเซ็ต`;
  if(lw.ok){const n=upW(w);if(n>w){w=n;why=`ครั้งก่อนทำถึงเพดานครบทุกเซ็ต → เพิ่มน้ำหนัก แล้วเริ่มที่ ${lo} ครั้ง`}else why='ถึงดัมเบลหนักสุดแล้ว → ลงช้า 4 วินาที หรือทำเพิ่ม 1 เซ็ต'}
  if(ph===3){w=downW(w*.8);why='สัปดาห์ Deload → เบาลง ~80% ให้ร่างกายฟื้น'}
  return {w,why};
}

  const k=s.date+'|'+s.type,d=(state.drafts[k]&&state.drafts[k].data[it.slot])||null;

}

  const td=today(),m=mon(td);
  return `<div class="week" role="group" aria-label="เลือกวันในสัปดาห์นี้">${[0,1,2,3,4,5,6].map(i=>{const d=addD(m,i),t=typeOf(d),lg=state.logs.some(l=>l.date===d&&l.type!=='desk');
    return `<button class="wd${d===sel?' on':''}${d===td?' td':''}" data-act="sel" data-d="${d}" aria-label="${thd(d)} ${TYPES[t].n}${lg?' บันทึกแล้ว':''}" ${d===sel?'aria-pressed="true"':''}><span class="wd-n">${DN[pd(d).getDay()]}</span><span class="wd-d num">${pd(d).getDate()}</span>${tIc(t,'wd-i')}<span class="wd-dot${lg?' f':''}"></span></button>`}).join('')}</div>`;

function vToday(){
  const td=today();
  const s=buildSession(sel,deskMode?'desk':null);cur=s;
  const P=PH[s.ph],T=TYPES[s.type],dow=pd(sel).getDay();
  const subPh=`สัปดาห์ ${s.ph+1}/4 · ${P.n}${s.ph===3?tip('deload'):''}`;
  let h=lt(sel===td?'วันนี้':thd(sel),`${sel===td?thd(sel)+' · ':''}${subPh}`)+weekStrip();
  // ----- hero -----
  const {tot,dn}=sessionCount(s),logged=isLogged(sel,s.type);
  const nEx=s.blocks.reduce((a,b)=>a+b.items.length,0);
  let meta=s.type==='rest'?'วันพักฟื้น':s.type==='game'?'วอร์มอัพ · ตีเกม · คูลดาวน์':`${s.est} นาที · ${nEx} ท่า · ${tot} เซ็ต`;
  h+=`<section class="grp hero" aria-label="เซสชันวันนี้"><div class="hero-h">${tIc(s.type,'hero-i')}<div><h2>${clean(T.n)}</h2><p class="meta">${meta}</p></div></div>`;
  if(s.type==='rest'){
    h+=`<p class="meta" style="margin:12px 0 16px">การพักคือส่วนหนึ่งของการฝึก นอน 7–8 ชม. ดื่มน้ำให้พอ เดินเบาๆ ได้</p><button class="btn tint" data-act="tomob">อยากขยับ: เปลี่ยนเป็นยืดเหยียด 20 นาที</button>`;
  }else{
    h+=`<div class="tally" role="img" aria-label="ทำแล้ว ${dn} จาก ${tot} เซ็ต">${s.blocks.map(b=>b.items.map(it=>`<span class="tg">${tallyCells(doneArr(s,it))}</span>`).join('')).join('')}</div>`;
    h+=`<div class="prog num">${logged?'บันทึกเซสชันนี้แล้ว':dn?`ทำแล้ว ${dn} จาก ${tot} เซ็ต`:'แต่ละช่องคือ 1 เซ็ต ทำเสร็จช่องจะเต็ม'}</div>`;
    const lbl=s.type==='game'?(dn?'ทำวอร์มอัพ/คูลดาวน์ต่อ':'เริ่มวอร์มอัพ'):logged?'เปิดดูอีกครั้ง':dn===0?'เริ่มฝึก':dn<tot?'ฝึกต่อ':'จบเซสชันและบันทึก';
    const act=(!logged&&dn===tot&&tot&&s.type!=='game')?'finish':'fopen';
    h+=`<button class="btn${logged?' tint':''}" data-act="${act}">${act==='fopen'&&!logged?ic('play'):''}${lbl}</button>`;
  }
  if(!deskMode&&dow!==GAME_DOW&&s.type!=='game'){
    const opts=Object.keys(TYPES).filter(k=>k!=='game'&&!TYPES[k].extra).map(k=>`<option value="${k}" ${k===s.type?'selected':''}>${TYPES[k].n}${k===state.week[dow]?' (ตามตาราง)':''}</option>`).join('');

function spark(vals,hiGood){

  return `<span class="spark"><svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${good?'var(--ac)':'var(--warn)'}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/></svg></span>`;
}

  sheet(`<div class="cele" role="status"><div class="cele-mark">${ic('check')}</div><h2>${wk>=planned&&log.type!=='desk'?'ครบตามแผนสัปดาห์นี้':'บันทึกแล้ว'}</h2><p class="meta num">${TYPES[log.type].n} · ${log.minutes} นาที${log.total?` · ${log.done}/${log.total} เซ็ต`:''}</p>

  return selRow({i:'target',t:'ความเร็วโหมดสุ่มมุม',v:{slow:'ช้า',mid:'กลาง',fast:'เร็ว'}[s],ch:'rtspd'},`<option value="slow" ${s==='slow'?'selected':''}>ช้า (มือใหม่)</option><option value="mid" ${s==='mid'?'selected':''}>กลาง</option><option value="fast" ${s==='fast'?'selected':''}>เร็ว</option>`)+(noVoice?'':`<label class="row has-i">${ic('speaker','row-i')}<span class="row-t">เสียงพูดบอกมุม</span><input class="sw" type="checkbox" data-ch="voice" ${state.settings.voice!==false?'checked':''} aria-label="เสียงพูดบอกมุม"></label>`)}
let RT=null;
/* ---------- เสียงพากย์ ----------
   คำพูดทั้งหมดอยู่ที่ VOICE (tools/gen_voice.py อ่านบรรทัดนี้ไปสร้าง mp3 ด้วย ElevenLabs → web/audio/<คีย์>.mp3)
   ถ้ามีไฟล์ใน audio/voice.json จะเล่นไฟล์นั้น ถ้าไม่มีใช้เสียงพูดภาษาไทยของเครื่องแทน */
const VOICE={"n5":"ห้า","n4":"สี่","n3":"สาม","n2":"สอง","n1":"หนึ่ง","start":"เริ่ม!","rest":"พัก","go":"ไปต่อ","last":"ต่อไป เซ็ตสุดท้าย","swap":"สลับข้าง","ten":"อีกสิบวินาที","done":"ครบทุกรอบ เยี่ยมมาก","fin":"ครบทุกเซ็ตแล้ว เยี่ยมมาก","c0":"หน้าซ้าย","c1":"หน้าขวา","c2":"กลางซ้าย","c3":"กลางขวา","c4":"หลังซ้าย","c5":"หลังขวา"};
let vinfo=null,vbuf={},vsrc=null,vloading=false;
async function loadVoice(){
  if(vloading||!actx)return;vloading=true;
  try{const r=await fetch('audio/voice.json',{cache:'no-cache'});if(r.ok)vinfo=await r.json()}catch(e){}
  if(!vinfo||!Array.isArray(vinfo.clips))return;
  for(const k of vinfo.clips){if(vbuf[k]||!VOICE[k])continue;
    try{const ab=await (await fetch(`audio/${k}.mp3?v=${vinfo.v}`)).arrayBuffer();vbuf[k]=await actx.decodeAudioData(ab)}catch(e){}}
}
function say(k){
  if(state.settings.voice===false)return;
  const b=vbuf[k];
  if(b&&actx){try{if(vsrc)try{vsrc.stop()}catch(e){}const s=actx.createBufferSource(),g=actx.createGain();g.gain.value=1;s.buffer=b;s.connect(g);g.connect(actx.destination);s.start();vsrc=s;return}catch(e){}}
  try{const u=new SpeechSynthesisUtterance(VOICE[k]||k);u.lang='th-TH';u.rate=1.15;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}
}
const voiceKind=()=>Object.keys(vbuf).length?'เสียงพากย์ ElevenLabs':'เสียงพูดของเครื่อง';
function rtStart(rounds,work,rest,onDone){
  unlockAudio();stopTimer();rtStop();
  const sp=RT_SPD[state.settings.rtSpd||'mid'];
  RT={rounds,work,rest,onDone,round:1,phase:'prep',end:Date.now()+3000,next:0,last:-1,cells:[...document.querySelectorAll('#court div')]};
  $('#rt').classList.add('show');keepAwake();
  const clear=()=>RT.cells.forEach(c=>c.classList.remove('on'));
  RT.iv=setInterval(()=>{
    if(!RT)return;const now=Date.now(),left=Math.max(0,Math.ceil((RT.end-now)/1000));
    $('#rtT').textContent=RT.phase==='work'?fmtClock(left):left;$('#rtR').textContent=`รอบ ${RT.round}/${RT.rounds}`;
    $('#rtPh').textContent=RT.phase==='prep'?'เตรียมตัว…':RT.phase==='work'?'ทำงาน!':'พัก เดินกลับกลางคอร์ท หายใจ';
    if(RT.phase==='work'&&now>=RT.next){clear();let i;do{i=Math.floor(Math.random()*6)}while(i===RT.last);RT.last=i;RT.cells[i].classList.add('on');beep(880,.12);say('c'+i);RT.next=now+sp[0]+Math.random()*(sp[1]-sp[0]);setTimeout(()=>{if(RT&&RT.last===i)RT.cells[i].classList.remove('on')},Math.min(900,sp[0]-200))}
    if(now>=RT.end){
      if(RT.phase==='prep'){RT.phase='work';RT.end=now+RT.work*1000;RT.next=now+400;beep(990,.3)}
      else if(RT.phase==='work'){clear();beep(990,.35);setTimeout(()=>beep(990,.35),400);
        if(RT.round>=RT.rounds){const d=RT.onDone;rtStop();toast('ครบทุกรอบ เยี่ยมมาก');setTimeout(()=>say('done'),500);d&&d();return}
        RT.phase='rest';RT.end=now+RT.rest*1000;setTimeout(()=>say('rest'),500)}
      else{RT.round++;RT.phase='work';RT.end=now+RT.work*1000;RT.next=now+400;beep(990,.3)}
    }
  },100);
}
function rtStop(){if(RT){clearInterval(RT.iv);RT=null}$('#rt').classList.remove('show');document.querySelectorAll('#court div').forEach(c=>c.classList.remove('on'));try{speechSynthesis.cancel()}catch(e){}}

/* ================= ตัวจับเวลา ================= */
let T=null,actx=null,wl=null;
function unlockAudio(){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();loadVoice()}catch(e){}}
function beep(f=880,d=.18){try{if(!actx)return;const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.25,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.start();o.stop(actx.currentTime+d)}catch(e){}}
function keepAwake(){try{if(navigator.wakeLock&&!wl)navigator.wakeLock.request('screen').then(l=>{wl=l;l.addEventListener('release',()=>wl=null)}).catch(()=>{})}catch(e){}}
/* เสียง "ติ๊ก" แบบนาฬิกา: คลิกสั้นๆ ความถี่สูง เบากว่าเสียงบี๊บ */
function tickSound(){try{if(!actx)return;const t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain(),f=actx.createBiquadFilter();
  o.type='square';o.frequency.setValueAtTime(2200,t);o.frequency.exponentialRampToValueAtTime(1200,t+.03);
  f.type='highpass';f.frequency.value=900;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.16,t+.003);g.gain.exponentialRampToValueAtTime(.0001,t+.045);
  o.connect(f);f.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+.05)}catch(e){}}
function releaseAwake(){try{if(wl){wl.release();wl=null}}catch(e){}}
function startTimer(label,sec,done,isRest){
  unlockAudio();if(T)clearInterval(T.iv);
  T={label,end:Date.now()+sec*1000,total:sec,done,last:null,isRest};
  $('#timer').classList.add('show');updPill();
  refreshCtl();T.iv=setInterval(tick,200);tick();keepAwake();
  if(!isRest)say('start');
}
/* หยุดเวลาชั่วคราว / ทำต่อ */
function stopVoice(){try{if(vsrc)vsrc.stop()}catch(e){}try{speechSynthesis.cancel()}catch(e){}}
function pauseTimer(){if(!T||T.paused)return;T.paused=true;T.left=Math.max(0,T.end-Date.now());stopVoice();updPill();refreshCtl()}
function resumeTimer(){if(!T||!T.paused)return;T.paused=false;T.end=Date.now()+T.left;T.last=Math.ceil(T.left/1000);updPill();refreshCtl();tick()}
function updPill(){const b=$('#tpb');if(!b||!T)return;b.dataset.act=T.paused?'tresume':'tpause';b.innerHTML=T.paused?ic('play')+'ทำต่อ':ic('pause')+'พัก';b.className='btn sm '+(T.paused?'':'red');$('#tl').textContent=(T.paused?'หยุดชั่วคราว · ':'')+T.label}
function tick(){
  if(!T||T.paused)return;const left=Math.max(0,(T.end-Date.now())/1000),s=Math.ceil(left),pct=Math.min(100,100-left/T.total*100)+'%';
  $('#tt').textContent=fmtClock(s);$('#tb').style.width=pct;
  const fT=$('#fT');if(fT){fT.textContent=fmtClock(s);$('#fB').style.width=pct}
  // ติ๊กทุกวินาที → นับถอยหลังด้วยเสียง 5-4-3-2-1 → บี๊บตอนหมดเวลา
  if(s!==T.last&&T.last!==null){if((s>5||(s>3&&state.settings.voice===false))&&state.settings.tick!==false&&!(s===10&&T.total>=20&&state.settings.voice!==false))tickSound();if(s===10&&T.total>=20)say('ten');if(s>=1&&s<=5){if(state.settings.voice===false){if(s<=3)beep(660,.12)}else say('n'+s)}}T.last=s;
  if(left<=0){const d=T.done,r=T.isRest;stopTimer();beep(990,.35);setTimeout(()=>beep(990,.35),400);if(r)setTimeout(()=>say('go'),850);d&&d()}
}
function stopTimer(){if(T){clearInterval(T.iv);T=null}$('#timer').classList.remove('show');if(!focusOpen()&&!RT)releaseAwake();refreshCtl()}

/* ================= Helpers ================= */
function toast(t){const e=$('#toast');e.innerHTML=ic('check')+esc(clean(t));e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2000)}
function setArr(k,i){const dr=getDraft(cur.date,cur.type);if(!dr.start)dr.start=Date.now();const a=dr.data[k]||(dr.data[k]=[]);a[i]=a[i]||{};return a[i]}
const itemByKey=k=>{for(const b of cur.blocks)for(const it of b.items)if(it.slot===k)return it;return null};
function markDone(k,i,val){

  if(val&&!EX[it.id][2].t){if(x.r==null||x.r==='')x.r=it.v;if(it.db&&(x.w==null||x.w==='')){const sw=suggestW(it.id,cur.ph,it);if(sw)x.w=sw.w}}

function importHealth(){
  let sl=null,rh=null;
  try{const q=new URLSearchParams(location.search);if(q.get('sleep'))sl=+q.get('sleep');if(q.get('rhr'))rh=+q.get('rhr')}catch(e){}
  const m=(location.hash||'').match(/^#h-s(\d+)(?:-r(\d+))?/);if(m){sl=+m[1]/10;rh=m[2]?+m[2]:null}
  if((sl==null||isNaN(sl))&&!rh)return;
  const d=today(),h=state.health[d]||(state.health[d]={});
  if(sl!=null&&!isNaN(sl)&&sl>0){h.sleep=Math.round(sl*10)/10;(state.checkins[d]=state.checkins[d]||{}).sleep=sleepScore(sl)}
  if(rh)h.rhr=rh;save();setTimeout(()=>toast('นำเข้าข้อมูลจากแอป Health แล้ว'),300);
  try{history.replaceState(null,'',location.pathname)}catch(e){}

    case 'copy':{const t=$('#exp');const ok=()=>{state.settings.lastBackup=today();save();toast('คัดลอกแล้ว')};try{navigator.clipboard.writeText(t.value).then(ok).catch(()=>{t.select();toast('กดค้างที่ข้อความเพื่อคัดลอก')})}catch(err){t.select();toast('กดค้างที่ข้อความเพื่อคัดลอก')}break}
    case 'import':loadBackup($('#imp').value);break;
    case 'reset':if(b.dataset.arm){state=defState();save();applyLook();render();toast('ล้างข้อมูลแล้ว');showOnb()}else{b.dataset.arm=1;b.querySelector('.row-t').textContent='แตะอีกครั้งเพื่อยืนยัน ลบทุกอย่างและกู้คืนไม่ได้';setTimeout(()=>{if(b.isConnected){delete b.dataset.arm;b.querySelector('.row-t').textContent='ล้างข้อมูลทั้งหมด'}},3500)}break;
    case 'onbnext':if(ONB.step<2){ONB.step++;renderOnb()}break;
    case 'onbback':ONB.step=Math.max(0,ONB.step-1);renderOnb();break;
    case 'onbpick':{ONB[b.dataset.g]=b.dataset.v;const db=$('#onbdb');if(db)ONB.db=db.value;const y=$('#onb').scrollTop;renderOnb();$('#onb').scrollTop=y;break}
    case 'onbskip':finishOnb(false);break;
    case 'onbdone':finishOnb(true);break;
    case 'onbshow':showOnb();break;
    case 'vtest':{if(state.settings.voice===false){toast('เปิดเสียงพูดภาษาไทยก่อน');break}
      loadVoice().then(()=>{const v=$('#vkind');if(v)v.textContent=voiceKind();say('start');const tk=state.settings.tick!==false?3:0;for(let i=1;i<=tk;i++)setTimeout(tickSound,1000*i);[5,4,3,2,1].forEach((n,i)=>setTimeout(()=>say('n'+n),1000*(tk+i+1)));setTimeout(()=>{beep(990,.35);setTimeout(()=>beep(990,.35),400)},1000*(tk+6))});break}
    case 'look':{const kk=b.dataset.k;state.settings[kk]=kk==='textSize'?+b.dataset.v:b.dataset.v;save();applyLook();keepScroll(render);break}
  }
});
document.addEventListener('input',e=>{
  const t=e.target;if(t.id==='libq'){$('#liblist').innerHTML=libList(t.value);return}
  if((t.id==='fw'||t.id==='fr')&&F){const x=setArr(flat()[F.i].it.slot,F.set);x[t.id==='fw'?'w':'r']=numIn(t.value);save()}
});
document.addEventListener('change',e=>{
  const t=e.target,c=t.dataset.ch;if(!c)return;
  const st=state.settings;
  if(c==='swapday'){const dow=pd(sel).getDay();if(t.value===state.week[dow])delete state.overrides[sel];else state.overrides[sel]=t.value;save();keepScroll(render)}
  else if(c==='week'){state.week[t.dataset.d]=t.value;save();keepScroll(render)}
  else if(c==='level'||c==='goal'){st[c]=t.value;save();keepScroll(render);toast('บันทึกแล้ว')}
  else if(c==='db'){st.dumbbells=t.value;save();toast('บันทึกแล้ว')}
  else if(c==='start'&&t.value){st.start=t.value;save();toast('บันทึกแล้ว')}
  else if(c==='tourn'){st.tourn=t.value;save();keepScroll(render)}
  else if(c==='rtspd'){st.rtSpd=t.value;save();const v=t.closest('.row').querySelector('.row-v');if(v)v.textContent={slow:'ช้า',mid:'กลาง',fast:'เร็ว'}[t.value]}
  else if(c==='voice'){st.voice=t.checked;save()}
  else if(c==='tick'){st.tick=t.checked;save();if(t.checked){unlockAudio();[0,1,2].forEach(i=>setTimeout(tickSound,i*1000))}}
  else if(c==='sleepH'||c==='rhr'){const h=state.health[sel]||(state.health[sel]={});const v=parseFloat(t.value);
    if(c==='sleepH'){if(v>0){h.sleep=v;(state.checkins[sel]=state.checkins[sel]||{}).sleep=sleepScore(v)}else delete h.sleep}
    else{if(v>0)h.rhr=v;else delete h.rhr}
    save();if(sheetKind==='ready'){const y=$('#sheet').scrollTop;readySheet();$('#sheet').scrollTop=y}keepScroll(render)}
  else if(c==='impfile'){const f=t.files&&t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>loadBackup(r.result);r.readAsText(f)}
});
document.addEventListener('keydown',e=>{
  if(focusOpen()&&!$('#modal').classList.contains('show')&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){
    if(e.key==='ArrowRight'){const b=$('#focus [data-act=fnext]');if(b&&!b.disabled)b.click();return}
    if(e.key==='ArrowLeft'){const b=$('#focus [data-act=fprev]');if(b&&!b.disabled)b.click();return}
  }
  if(e.key!=='Escape')return;
  if($('#modal').classList.contains('show'))closeSheet();
  else if(RT)rtStop();
  else if(focusOpen())closeFocus();
});
/* ปัดชีตลงเพื่อปิด */
(function(){let y0=null,dy=0;const sh=$('#sheet');
  sh.addEventListener('touchstart',e=>{y0=sh.scrollTop<=0?e.touches[0].clientY:null;dy=0},{passive:true});
  sh.addEventListener('touchmove',e=>{if(y0==null)return;dy=e.touches[0].clientY-y0;if(dy>0){sh.style.transform=`translateY(${dy}px)`;sh.style.transition='none'}},{passive:true});
  sh.addEventListener('touchend',()=>{if(y0==null)return;sh.style.transition='transform .25s var(--ease)';if(dy>110)closeSheet();sh.style.transform='';y0=null});
})();
/* กลับมาที่แอป: ตัวจับเวลาทำงานต่อ · ข้ามเที่ยงคืนแล้วให้ "วันนี้" เป็นวันใหม่ · ขอให้จอติดต่อถ้ายังฝึกอยู่ */
let lastDay=today();
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible')return;
  if(T)tick();
  const td=today();if(td!==lastDay){if(sel===lastDay&&!focusOpen()){sel=td;deskMode=false;render()}lastDay=td}
  if(focusOpen()||T||RT)keepAwake();
});

/* ================= เริ่มต้น ================= */
importHealth();applyLook();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{})}catch(e){}
if('serviceWorker' in navigator&&document.querySelector('link[rel="manifest"]')){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
render();
if(!state.settings.onboarded)showOnb();

</script>
</body>
