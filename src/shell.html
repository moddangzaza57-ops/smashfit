<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Smash Fit">
<meta name="theme-color" content="#0e1411">
<title>Smash Fit – ฟิตเนสนักแบด</title>
<!--PWA-->
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1411;--card:#16201b;--card2:#1d2a23;--line:#2a3a31;--tx:#e9f2ec;--mu:#8fa69a;--ac:#c8f23c;--ac2:#4fd1a5;--warn:#ffb547;--bad:#ff6b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx)}
body{font-family:'IBM Plex Sans Thai',system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.45;padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
main{max-width:560px;margin:0 auto;padding:12px 14px calc(150px + env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;align-items:center;margin:4px 0 8px}
.brand{font-weight:700;letter-spacing:.3px}.brand b{color:var(--ac)}
h1{font-size:22px;margin:2px 0}h2{font-size:17px;margin:0 0 6px}
.mu{color:var(--mu);font-size:14px}.sm{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.chips{display:flex;gap:5px}
.chip{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:6px 0 5px;text-align:center;font:inherit;font-size:12px;line-height:1.25}
.chip .ic{display:block;font-size:17px;margin:2px 0}
.chip.on{background:var(--ac);color:#10200a;border-color:var(--ac);font-weight:600}
.chip.td{border-color:var(--ac2)}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--card2);font-size:12px;color:var(--ac2);border:1px solid var(--line)}
.note{background:rgba(255,181,71,.09);border:1px solid rgba(255,181,71,.35);color:#ffd79a;border-radius:12px;padding:8px 10px;font-size:14px;margin:6px 0}
.note.good{background:rgba(79,209,165,.09);border-color:rgba(79,209,165,.35);color:#a8f0d5}
.note.bad{background:rgba(255,107,107,.09);border-color:rgba(255,107,107,.4);color:#ffb3b3}
code{font-size:12px;background:var(--card2);padding:1px 4px;border-radius:4px;word-break:break-all}
details summary{cursor:pointer}
.scale button{font-size:14px}
.btn{display:block;background:var(--ac);color:#10200a;border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:600;width:100%;text-align:center}
.btn.sec{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.btn.sm{display:inline-block;width:auto;padding:6px 12px;font-size:14px}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.ex{border-top:1px solid var(--line);padding:12px 0}
.card h2+.ex{border-top:0;padding-top:4px}
.exn{font-weight:600;cursor:pointer}.exn .i{color:var(--mu);font-weight:400;font-size:13px}
.rx{color:var(--ac2);font-size:14px}
.sug{font-size:13px;color:var(--ac);margin-top:2px}
.cue{font-size:13px;color:var(--mu);margin-top:4px;display:none;background:var(--card2);border-radius:10px;padding:8px 10px}
.ex.open .cue{display:block}
.sets{display:grid;gap:6px;margin-top:8px}
.set{display:grid;grid-template-columns:24px 1fr 1fr 48px;gap:6px;align-items:center}
.set.t{grid-template-columns:24px 1fr 48px}
.set>span{color:var(--mu);font-size:13px;text-align:center}
.set input{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:8px;font:inherit;font-size:16px;text-align:center}
.ck{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--mu);font-size:18px}
.ck.on{background:var(--ac);color:#10200a;border-color:var(--ac)}
.play{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--tx);font:inherit;font-size:15px}
select,input[type=date],input[type=number],input[type=text],textarea{background:var(--bg);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:9px 10px;font:inherit;font-size:16px;width:100%}
textarea{min-height:90px;font-size:13px}
.lbl{font-size:13px;color:var(--mu);margin:10px 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.day{display:grid;grid-template-columns:76px 1fr;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.day:first-of-type{border-top:0}
.day .w{grid-column:2;font-size:12px;color:#ffd79a;margin-top:-4px}
.lock{padding:9px 10px;border-radius:10px;background:var(--card2);border:1px dashed var(--ac);font-size:15px}
.scale{display:flex;gap:5px;margin:4px 0 8px}
.scale button{flex:1;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:inherit}
.scale button.on{background:var(--ac2);color:#06231a;border-color:var(--ac2);font-weight:600}
.rpe{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rpe button{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:inherit}
.rpe button.on{background:var(--ac);color:#10200a;border-color:var(--ac);font-weight:700}
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}.prog i{display:block;height:100%;background:var(--ac);width:0;transition:width .3s}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px;margin-top:8px}
.bars div{flex:1;background:var(--ac2);border-radius:6px 6px 0 0;min-height:3px;opacity:.75}
.bars div.cur{background:var(--ac);opacity:1}
.blbl{display:flex;gap:6px;margin-top:4px}.blbl span{flex:1;text-align:center;font-size:10px;color:var(--mu)}
.log{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px solid var(--line);align-items:center}
.log:first-of-type{border-top:0}
.x{background:none;border:1px solid var(--line);color:var(--mu);border-radius:8px;padding:4px 8px;font:inherit;font-size:12px}
.x.arm{color:var(--bad);border-color:var(--bad)}
.ph{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:8px 0}
.ph div{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:6px;font-size:11px;text-align:center;line-height:1.3}
.ph div.on{border-color:var(--ac);color:var(--ac)}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(14,20,17,.95);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:20}
nav .in{display:flex;max-width:560px;margin:0 auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;color:var(--mu);font:inherit;font-size:12px;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:1px}
nav button .ic{font-size:20px;filter:grayscale(1);opacity:.7}
nav button.on{color:var(--ac)}nav button.on .ic{filter:none;opacity:1}
.timer{position:fixed;left:10px;right:10px;bottom:calc(68px + env(safe-area-inset-bottom));background:var(--card2);border:1px solid var(--ac);border-radius:16px;padding:10px 14px;display:none;z-index:30;max-width:540px;margin:0 auto;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.timer.show{display:block}
.trow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tt{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.tbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}.tbar i{display:block;height:100%;background:var(--ac);width:0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:40}
.modal.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top));background:var(--ac);color:#10200a;padding:8px 14px;border-radius:999px;font-size:14px;font-weight:600;z-index:50;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
.chk{display:flex;gap:8px;align-items:flex-start;padding:4px 0;font-size:14px}
ul.tips{margin:6px 0 0;padding-left:20px;font-size:14px;color:var(--mu)}
.exrow{display:flex;gap:10px;align-items:flex-start}
.thumb{width:64px;height:52px;flex:none;background:var(--card2);border-radius:10px;overflow:hidden;cursor:pointer}
.thumb svg{width:100%;height:100%;display:block}
.exn .i{color:var(--ac2);font-size:12px;font-weight:500;white-space:nowrap}
.anim{width:100%;height:230px;background:var(--card2);border-radius:14px;display:block;margin:10px 0}
.shh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.sheet h3{font-size:15px;margin:14px 0 4px;color:var(--ac)}
.sheet ol,.sheet ul{margin:0;padding-left:22px;font-size:15px}.sheet li{margin:3px 0}
.sheet p{margin:0;font-size:15px}
.mini{background:var(--card2);border-radius:12px;padding:8px 10px;font-size:14px}.mini b{display:block;color:var(--ac2);font-size:13px}
a.btn{text-decoration:none;margin-top:12px}
.libi{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.card h2+.libi{border-top:0}
.libi .thumb{width:72px;height:56px}
.rt{position:fixed;inset:0;background:var(--bg);z-index:45;display:none;flex-direction:column;padding:calc(12px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom))}
.rt.show{display:flex}
.rtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.court{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr 1fr;gap:8px;margin:12px 0;border:3px solid var(--line);border-top:6px solid var(--ac2);border-radius:12px;padding:8px;max-height:70vh}
.court div{background:var(--card);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--mu);transition:background .1s}
.court div.on{background:var(--ac);color:#10200a;font-size:30px;font-weight:700}
.rtbig{text-align:center;font-size:44px;font-weight:700;font-variant-numeric:tabular-nums}
.net{text-align:center;font-size:12px;color:var(--ac2);margin-top:8px}
</style>
</head>
<body>
<main id="app"></main>
<div class="timer" id="timer">
  <div class="trow"><div><div class="mu" id="tl">พัก</div><div class="tt" id="tt">0:00</div></div>
  <div class="row" style="display:flex;gap:6px"><button class="btn sec sm" data-act="t15">+15</button><button class="btn sm" data-act="tskip">ข้าม</button><button class="btn sec sm" data-act="tstop">✕</button></div></div>
  <div class="tbar"><i id="tb"></i></div>
</div>
<div class="modal" id="modal" data-act="mclose"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<div class="rt" id="rt">
  <div class="rtop"><div><div class="mu" id="rtPh">เตรียมตัว</div><div class="rtbig" id="rtT">3</div></div><div class="mu" id="rtR"></div><button class="btn sec sm" data-act="rtstop">หยุด</button></div>
  <div class="net">— เน็ต —</div>
  <div class="court" id="court"><div>หน้าซ้าย</div><div>หน้าขวา</div><div>กลางซ้าย</div><div>กลางขวา</div><div>หลังซ้าย</div><div>หลังขวา</div></div>
  <div class="mu sm" style="text-align:center">สปลิตสเต็ป → พุ่งไปมุมที่ขึ้น → ทำท่าตี → กลับกลางทันที</div>
</div>
<nav><div class="in">
  <button data-nav="today"><span class="ic">🏸</span>วันนี้</button>
  <button data-nav="plan"><span class="ic">🗓️</span>ตาราง</button>
  <button data-nav="lib"><span class="ic">📚</span>คลังท่า</button>
  <button data-nav="hist"><span class="ic">📈</span>ก้าวหน้า</button>
  <button data-nav="set"><span class="ic">⚙️</span>ตั้งค่า</button>
</div></nav>
<script src="figure.js"></script>
<script src="exdata.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
