<!--PWA-->
<script>/* ใช้ธีม สีหลัก และขนาดตัวอักษรที่ผู้ใช้เลือกก่อนวาดหน้า (ไม่กระพริบ) */try{var s=(JSON.parse(localStorage.getItem('smashfit.v1'))||{}).settings||{},r=document.documentElement;if(s.theme==='light'||s.theme==='dark')r.dataset.theme=s.theme;if(s.accent&&s.accent!=='green')r.dataset.accent=s.accent;if(s.textSize==1.1||s.textSize==1.2)r.style.setProperty('--tz',s.textSize)}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light dark;
  --bg:#f2f2f7;--cell:#fff;--cell-hi:#fff;--fill:rgba(118,118,128,.12);--fill2:rgba(118,118,128,.2);--sep:rgba(60,60,67,.2);
  --tx:#000;--tx2:#636366;
  --ac:#18794e;--ac-tx:#fff;--ac-soft:rgba(24,121,78,.12);--ac-ink:#18794e;
  --game:#0060df;--game-soft:rgba(0,96,223,.14);
  --warn:#a64b00;--warn-soft:rgba(255,149,0,.15);--bad:#c4001a;--bad-soft:rgba(255,59,48,.12);
  --seg-on:#fff;--seg-sh:0 1px 3px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04);
  --sheet-sh:0 -8px 40px rgba(0,0,0,.12);
  --fig-near:#1c1c1e;--fig-far:#9a9aa0;--fig-db:#18794e;--fig-rk:#0060df;--fig-gr:#c7c7cc;--fig-pr:#d1d1d6;--fig-bg:#fff;
  --r:12px;--ease:cubic-bezier(.22,1,.36,1);
  --font:-apple-system,BlinkMacSystemFont,"Noto Sans Thai","Segoe UI","Leelawadee UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000;--cell:#1c1c1e;--cell-hi:#2c2c2e;--fill:rgba(118,118,128,.24);--fill2:rgba(118,118,128,.36);--sep:rgba(84,84,88,.65);
  --tx:#fff;--tx2:#98989f;
  --ac:#30d158;--ac-tx:#00210d;--ac-soft:rgba(48,209,88,.16);--ac-ink:#30d158;
  --game:#409cff;--game-soft:rgba(64,156,255,.2);
  --warn:#ffb340;--warn-soft:rgba(255,179,64,.16);--bad:#ff6961;--bad-soft:rgba(255,105,97,.16);--bad-tx:#2b0000;
  --seg-on:#636366;--seg-sh:none;--sheet-sh:none;
  --fig-near:#f2f2f7;--fig-far:#8e8e93;--fig-db:#30d158;--fig-rk:#409cff;--fig-gr:#3a3a3c;--fig-pr:#48484a;--fig-bg:#1c1c1e;
}}
:root[data-theme="dark"]{
  --bg:#000;--cell:#1c1c1e;--cell-hi:#2c2c2e;--fill:rgba(118,118,128,.24);--fill2:rgba(118,118,128,.36);--sep:rgba(84,84,88,.65);
  --tx:#fff;--tx2:#98989f;
  --ac:#30d158;--ac-tx:#00210d;--ac-soft:rgba(48,209,88,.16);--ac-ink:#30d158;
  --game:#409cff;--game-soft:rgba(64,156,255,.2);
  --warn:#ffb340;--warn-soft:rgba(255,179,64,.16);--bad:#ff6961;--bad-soft:rgba(255,105,97,.16);--bad-tx:#2b0000;
  --seg-on:#636366;--seg-sh:none;--sheet-sh:none;
  --fig-near:#f2f2f7;--fig-far:#8e8e93;--fig-db:#30d158;--fig-rk:#409cff;--fig-gr:#3a3a3c;--fig-pr:#48484a;--fig-bg:#1c1c1e;
}
/* ===== สีหลักที่ผู้ใช้เลือก (ค่าเริ่มต้น = เขียวสนาม) ===== */
:root[data-accent="blue"]{--ac:#0060df;--ac-tx:#fff;--ac-soft:rgba(0,96,223,.12);--ac-ink:#0060df;--fig-db:#0060df;--game:#7a3fd1;--game-soft:rgba(122,63,209,.14)}
:root[data-accent="orange"]{--ac:#b34700;--ac-tx:#fff;--ac-soft:rgba(179,71,0,.12);--ac-ink:#b34700;--fig-db:#b34700}
:root[data-accent="purple"]{--ac:#7a3fd1;--ac-tx:#fff;--ac-soft:rgba(122,63,209,.12);--ac-ink:#7a3fd1;--fig-db:#7a3fd1}
:root[data-accent="pink"]{--ac:#c2185b;--ac-tx:#fff;--ac-soft:rgba(194,24,91,.12);--ac-ink:#c2185b;--fig-db:#c2185b}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"])[data-accent="blue"]{--ac:#409cff;--ac-tx:#001a3d;--ac-soft:rgba(64,156,255,.18);--ac-ink:#409cff;--fig-db:#409cff;--game:#bf5af2;--game-soft:rgba(191,90,242,.2)}
  :root:not([data-theme="light"])[data-accent="orange"]{--ac:#ff9f0a;--ac-tx:#2b1600;--ac-soft:rgba(255,159,10,.18);--ac-ink:#ff9f0a;--fig-db:#ff9f0a}
  :root:not([data-theme="light"])[data-accent="purple"]{--ac:#bf5af2;--ac-tx:#1f0430;--ac-soft:rgba(191,90,242,.2);--ac-ink:#bf5af2;--fig-db:#bf5af2}
  :root:not([data-theme="light"])[data-accent="pink"]{--ac:#ff6482;--ac-tx:#3a0010;--ac-soft:rgba(255,100,130,.18);--ac-ink:#ff6482;--fig-db:#ff6482}
}
:root[data-theme="dark"][data-accent="blue"]{--ac:#409cff;--ac-tx:#001a3d;--ac-soft:rgba(64,156,255,.18);--ac-ink:#409cff;--fig-db:#409cff;--game:#bf5af2;--game-soft:rgba(191,90,242,.2)}
:root[data-theme="dark"][data-accent="orange"]{--ac:#ff9f0a;--ac-tx:#2b1600;--ac-soft:rgba(255,159,10,.18);--ac-ink:#ff9f0a;--fig-db:#ff9f0a}
:root[data-theme="dark"][data-accent="purple"]{--ac:#bf5af2;--ac-tx:#1f0430;--ac-soft:rgba(191,90,242,.2);--ac-ink:#bf5af2;--fig-db:#bf5af2}
:root[data-theme="dark"][data-accent="pink"]{--ac:#ff6482;--ac-tx:#3a0010;--ac-soft:rgba(255,100,130,.18);--ac-ink:#ff6482;--fig-db:#ff6482}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx)}
body{zoom:var(--tz,1);font-family:var(--font);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);caret-color:var(--ac)}
body.lock{overflow:hidden}
::selection{background:var(--ac-soft)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:8px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
h1,h2,h3,p{margin:0}
.num{font-variant-numeric:tabular-nums}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i .fill{fill:currentColor;stroke:none}
main{max-width:600px;margin:0 auto;padding:0 16px calc(120px + env(safe-area-inset-bottom))}

/* ===== large title ===== */
.lt{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:14px 4px 12px}
.lt h1{font-size:34px;line-height:1.2;font-weight:700;letter-spacing:-.02em}
.lt .sub{color:var(--tx2);font-size:15px;margin-top:2px;display:flex;align-items:center;gap:2px;flex-wrap:wrap}
.lt-aux{padding-bottom:6px}

/* ===== grouped lists ===== */
.grp{background:var(--cell);border-radius:var(--r);overflow:hidden;margin:0 0 24px}
.sec{font-size:13px;font-weight:400;color:var(--tx2);padding:0 16px 7px;margin-top:-4px}
.foot{font-size:13px;color:var(--tx2);padding:0 16px;margin:-16px 0 24px;line-height:1.55}
.foot ul{margin:4px 0 0;padding-left:18px}.foot li{margin:3px 0}
.row{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:50px;padding:10px 16px;text-align:left;color:var(--tx)}
.row+.row::before,.row+.rowx::before,.rowx+.row::before{content:"";position:absolute;top:0;right:0;left:var(--inset,16px);border-top:.5px solid var(--sep)}
.row.has-i{--inset:50px}
.row:has(.thumb){--inset:96px}
button.row:active,label.row:active{background:var(--fill)}
.row-i{color:var(--tx2)}
.row-t{flex:1;min-width:0;display:flex;flex-direction:column}
.row-t b{font-weight:600}
.row-t small{font-size:14px;color:var(--tx2);line-height:1.4}
.row-v{color:var(--tx2);font-size:16px;text-align:right;white-space:nowrap;max-width:55%;overflow:hidden;text-overflow:ellipsis}
.chev{width:16px;height:16px;color:var(--tx2);opacity:.6;stroke-width:2.4}
.row.sel{cursor:pointer}
.row.sel select{position:absolute;inset:0;opacity:0;width:100%;height:100%;font-size:16px;cursor:pointer}
.row-in{flex:0 1 50%;min-width:0;text-align:right;background:none;border:0;color:var(--tx);font:inherit;font-size:17px;padding:4px 0}
.row-in::placeholder{color:var(--tx2)}
.row-in[type=date]{flex:0 0 auto;width:auto;color:var(--tx);-webkit-appearance:none;appearance:none;min-height:34px;background:var(--fill);border-radius:8px;padding:4px 10px;font-size:16px}
.row.sel:focus-within{outline:2px solid var(--ac);outline-offset:-2px;border-radius:var(--r)}
.focus:focus{outline:none}
.row.danger{color:var(--bad);justify-content:center;font-weight:500}
.row.link .row-t{color:var(--ac-ink)}
.rowx{position:relative;padding:12px 16px}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--tx2);margin-top:9px;align-self:flex-start}
.n-good .dot{background:var(--ac)}.n-warn .dot{background:var(--warn)}.n-bad .dot{background:var(--bad)}
.n-bad .row-t{color:var(--bad)}

/* ===== buttons ===== */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;padding:12px 18px;border-radius:var(--r);background:var(--ac);color:var(--ac-tx);font-size:17px;font-weight:600;text-decoration:none;transition:transform .15s var(--ease),opacity .15s}
.btn:active{transform:scale(.98);opacity:.85}
.btn.tint{background:var(--ac-soft);color:var(--ac-ink)}
.btn.plain{background:var(--fill);color:var(--tx)}
.btn.red{background:var(--bad);color:var(--bad-tx,#fff)}
.brow{display:flex;gap:10px}
.brow .btn.red{flex:0 0 auto;width:auto;padding-left:18px;padding-right:20px}
.brow .btn:not(.red){flex:1;white-space:nowrap}
.f-timer .acts .btn{white-space:nowrap;padding-left:8px;padding-right:8px}
.f-timer.paused .ft{color:var(--tx2)}
.f-timer.paused .fb i{background:var(--tx2)}
.timer .btn.sm{min-width:52px;padding:6px 10px}
.btn.sm{width:auto;min-height:36px;padding:6px 14px;font-size:15px;border-radius:999px}
.btn[disabled]{opacity:.45;pointer-events:none}
.tip{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;margin:-6px -4px -6px 0;color:var(--ac-ink);vertical-align:middle}
.tip svg.i{width:17px;height:17px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;background:var(--fill);font-size:13px;color:var(--tx2)}

/* ===== segmented ===== */
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{flex:1;min-height:36px;border-radius:7px;font-size:15px;color:var(--tx);white-space:nowrap;transition:background .2s var(--ease)}
.seg button.on{background:var(--seg-on);box-shadow:var(--seg-sh);font-weight:600}
.seg.five button{min-height:44px;font-size:17px}
.rpe{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.rpe button{min-height:46px;border-radius:10px;background:var(--fill);font-size:17px}
.rpe button.on{background:var(--ac);color:var(--ac-tx);font-weight:700}

/* ===== week strip ===== */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:0 0 16px}
.wd{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 8px;border-radius:14px;color:var(--tx)}
.wd-n{font-size:12px;color:var(--tx2)}
.wd-d{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;font-size:17px;font-weight:500}
.wd.td .wd-d{color:var(--ac-ink);font-weight:700}
.wd.on .wd-d{background:var(--tx);color:var(--bg);font-weight:700}
.wd.on.td .wd-d{background:var(--ac);color:var(--ac-tx)}
.wd-i{width:18px;height:18px;color:var(--tx2);stroke-width:1.7}
.wd-dot{width:5px;height:5px;border-radius:50%}
.wd-dot.f{background:var(--ac)}

/* ===== logbook tally ===== */
.tally{display:flex;flex-wrap:wrap;gap:6px 9px;align-items:center}
.tg{display:inline-flex;gap:3px}
.tally i{width:11px;height:11px;border-radius:3px;background:var(--fill2);display:block;transition:background .3s var(--ease)}
.tally i.f{background:var(--ac)}
.tally.sm{flex-wrap:nowrap;gap:3px;flex:none}
.tally.sm i{width:8px;height:8px;border-radius:2px}
.tally.lg{gap:8px;justify-content:center}.tally.lg i{width:26px;height:26px;border-radius:7px}

/* ===== hero ===== */
.hero{padding:18px 16px 16px}
.hero-h{display:flex;gap:14px;align-items:flex-start}
.hero-i{width:30px;height:30px;color:var(--ac-ink);margin-top:3px;stroke-width:1.7}
.hero h2{font-size:24px;line-height:1.3;font-weight:700;letter-spacing:-.01em}
.meta{font-size:15px;color:var(--tx2)}
.hero .tally{margin:16px 0 8px}
.hero .prog{font-size:13px;color:var(--tx2);margin-bottom:14px}
.hero-ctl{border-top:.5px solid var(--sep);margin:16px -16px -16px;padding:0}
.hero-ctl .rowx{padding:12px 16px}
.lbl{font-size:13px;color:var(--tx2);margin-bottom:6px}
.ex-row .row-t b{font-size:16px}
.thumb{width:68px;height:54px;flex:none;border-radius:10px;background:var(--fill);overflow:hidden;color:var(--tx)}
.thumb svg{width:100%;height:100%;display:block}
.tag{font-size:13px;color:var(--warn)}
.done-row .row-t b{color:var(--tx2)}

/* ===== forms ===== */
.field{display:flex;flex-direction:column;gap:6px;padding:12px 16px;position:relative}
.field+.field::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.in,select.in,textarea.in{width:100%;background:var(--fill);border:0;border-radius:10px;color:var(--tx);font:inherit;font-size:17px;padding:10px 12px}
textarea.in{min-height:80px;font-size:16px}
.in::placeholder{color:var(--tx2)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -16px 6px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:6px 14px;border-radius:999px;background:var(--cell);font-size:15px;color:var(--tx);white-space:nowrap}
.chip.on{background:var(--tx);color:var(--bg);font-weight:600}
.wrap{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
.wrap .chip{background:var(--fill)}
.wrap .chip.on{background:var(--ac);color:var(--ac-tx)}
.search{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:10px;padding:0 10px;margin:0 0 12px;color:var(--tx2)}
.search input{flex:1;background:none;border:0;color:var(--tx);font:inherit;font-size:17px;padding:9px 0;min-width:0}
.search input::placeholder{color:var(--tx2)}
.chk{display:flex;gap:12px;align-items:center}
input[type=checkbox].sw{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:999px;background:var(--fill2);position:relative;flex:none;transition:background .2s;margin:0;cursor:pointer}
input[type=checkbox].sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .25s var(--ease)}
input[type=checkbox].sw:checked{background:var(--ac)}
input[type=checkbox].sw:checked::after{transform:translateX(20px)}

/* ===== tab bar ===== */
.tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--cell);background:color-mix(in srgb,var(--cell) 82%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);z-index:20}
.tabbar .in{display:flex;max-width:600px;margin:0 auto;padding:6px 4px calc(4px + env(safe-area-inset-bottom))}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:500;color:var(--tx2);padding:2px 0;min-height:48px}
.tabbar button svg.i{width:26px;height:26px;stroke-width:1.7}
.tabbar button[aria-current="page"]{color:var(--ac-ink)}

/* ===== rest pill (outside focus) ===== */
.timer{position:fixed;left:16px;right:16px;bottom:calc(70px + env(safe-area-inset-bottom));max-width:568px;margin:0 auto;display:none;align-items:center;gap:12px;padding:10px 10px 10px 16px;border-radius:16px;background:var(--cell-hi);box-shadow:var(--sheet-sh),0 0 0 .5px var(--sep);z-index:30}
.timer.show{display:flex}
body.lock .timer,body:not(.v-today) .timer{display:none}
.timer .tt{font-size:28px;font-weight:600}
.timer .tl{font-size:13px;color:var(--tx2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer .tb{position:absolute;left:16px;right:16px;bottom:5px;height:3px;border-radius:2px;background:var(--fill);overflow:hidden}
.timer .tb i{display:block;height:100%;background:var(--ac);width:0}

/* ===== sheets ===== */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;z-index:60}
.modal.show{display:flex;animation:fade .25s var(--ease)}
.sheet{background:var(--bg);width:100%;max-width:600px;margin:0 auto;border-radius:14px 14px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));max-height:calc(92vh / var(--tz,1));overflow:auto;box-shadow:var(--sheet-sh);animation:up .35s var(--ease);overscroll-behavior:contain}
.sheet:focus{outline:none}
.grab{width:36px;height:5px;border-radius:3px;background:var(--fill2);margin:0 auto 10px}
.shh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.shh h2{font-size:22px;font-weight:700;line-height:1.3}
.shh .x{min-height:36px;padding:6px 14px;border-radius:999px;background:var(--fill);font-size:15px;font-weight:600;flex:none}
.sheet .note{font-size:15px;color:var(--tx2);margin:8px 4px 14px}
.anim{width:100%;height:220px;background:var(--cell);border-radius:var(--r);display:block;margin:0 0 16px}
.sheet h3{font-size:17px;font-weight:600;margin:20px 4px 6px}
.sheet ol,.sheet ul.l{margin:0;padding:12px 16px 12px 36px;background:var(--cell);border-radius:var(--r);font-size:16px}
.sheet li{margin:4px 0}
.sheet p.body{background:var(--cell);border-radius:var(--r);padding:12px 16px;font-size:16px}
.why{display:flex;gap:10px;background:var(--ac-soft);color:var(--tx);border-radius:var(--r);padding:12px 14px;font-size:15px}
.why svg.i{color:var(--ac-ink)}
.mini{background:var(--cell);border-radius:var(--r);padding:12px 14px;font-size:15px}
.mini b{display:block;font-size:13px;color:var(--tx2);font-weight:500;margin-bottom:2px}
.term p{font-size:17px;line-height:1.6;background:var(--cell);border-radius:var(--r);padding:14px 16px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{background:rgba(0,0,0,0)}}

/* ===== toast ===== */
.toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translate(-50%,-12px);display:flex;align-items:center;gap:8px;background:var(--cell-hi);color:var(--tx);padding:10px 18px 10px 14px;border-radius:999px;font-size:15px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.16),0 0 0 .5px var(--sep);z-index:80;opacity:0;transition:opacity .25s var(--ease),transform .35s var(--ease);pointer-events:none;max-width:calc(100vw - 32px)}
.toast svg.i{color:var(--ac-ink);width:20px;height:20px}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ===== focus mode ===== */
.focus{position:fixed;inset:0;background:var(--bg);z-index:45;display:none;flex-direction:column;padding:calc(6px + env(safe-area-inset-top)) 16px calc(12px + env(safe-area-inset-bottom));overflow-y:auto;overscroll-behavior:contain}
.focus.show{display:flex;animation:rise .35s var(--ease)}
@keyframes rise{from{transform:translateY(28px)}to{transform:none}}
.f-in{max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column;flex:1}
.f-top{display:flex;align-items:center;gap:8px;min-height:48px}
.f-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;background:var(--fill);color:var(--tx)}
.f-pos{flex:1;text-align:center;font-size:15px;font-weight:600;line-height:1.3}
.f-pos small{display:block;font-size:13px;font-weight:400;color:var(--tx2)}
.f-prog{height:4px;border-radius:2px;background:var(--fill);overflow:hidden;margin:6px 0 12px}
.f-prog i{display:block;height:100%;background:var(--ac);transition:width .4s var(--ease)}
.f-fig{width:100%;height:clamp(130px,calc(26vh / var(--tz,1)),230px);background:var(--cell);border-radius:16px;display:block}
.f-name{font-size:26px;font-weight:700;line-height:1.25;margin:16px 0 2px;letter-spacing:-.01em}
.f-rx{font-size:16px;color:var(--tx2)}
.f-sug{font-size:15px;color:var(--ac-ink);margin-top:6px}
.f-tag{font-size:14px;color:var(--warn);margin-top:4px}
.f-sets{display:flex;gap:8px;margin:18px 0 6px;flex-wrap:wrap}
.sc{min-width:48px;height:48px;border-radius:12px;background:var(--fill);font-size:17px;font-weight:600;display:grid;place-items:center;color:var(--tx)}
.sc.f{background:var(--ac);color:var(--ac-tx)}
.sc.cur{box-shadow:inset 0 0 0 2.5px var(--tx)}
.sc.f.cur{box-shadow:inset 0 0 0 2.5px var(--tx)}
.sc svg.i{width:22px;height:22px;stroke-width:2.6}
.f-ctl{margin-top:auto;padding-top:14px}
.steps{display:grid;gap:10px;margin-bottom:14px}
.step{display:flex;align-items:center;gap:8px;background:var(--cell);border-radius:16px;padding:8px}
.step .lb{font-size:13px;color:var(--tx2);width:62px;padding-left:8px;line-height:1.3}
.step button{width:56px;height:56px;border-radius:12px;background:var(--fill);display:grid;place-items:center;flex:none;color:var(--tx)}
.step button:active{background:var(--fill2)}
.step svg.i{width:24px;height:24px;stroke-width:2.4}
.step input{flex:1;min-width:0;width:100%;text-align:center;background:none;border:0;color:var(--tx);font:inherit;font-size:40px;font-weight:600;font-variant-numeric:tabular-nums;padding:0}
.step input::placeholder{color:var(--tx2);font-weight:500}
.step .u{font-size:15px;color:var(--tx2);margin-left:-6px;padding-right:4px}
.f-nav{display:flex;justify-content:space-between;gap:10px;margin-top:10px}
.f-nav .btn{flex:1;white-space:nowrap;padding-left:10px;padding-right:10px}
.f-nav .btn.sq{flex:0 0 56px}
.f-timer{background:var(--cell);border-radius:16px;padding:16px;margin-bottom:12px;text-align:center}
.f-timer .fl{font-size:15px;color:var(--tx2)}
.f-timer .ft{font-size:72px;line-height:1.1;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.f-timer .fb{height:6px;background:var(--fill);border-radius:3px;overflow:hidden;margin:10px 0 14px}
.f-timer .fb i{display:block;height:100%;background:var(--ac);width:0}
.f-timer .acts{display:flex;gap:8px}.f-timer .acts .btn{flex:1}
.f-done{text-align:center;padding:12px 0}
.f-done .mark,.cele-mark{width:72px;height:72px;border-radius:50%;background:var(--ac);color:var(--ac-tx);display:grid;place-items:center;margin:0 auto 12px}
.f-done .mark svg.i,.cele-mark svg.i{width:38px;height:38px;stroke-width:2.6}
.f-done h2{font-size:24px;font-weight:700}
.big-time{font-size:56px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0 12px}

/* ===== celebration ===== */
.cele{text-align:center;padding:10px 0 4px}
.cele h2{font-size:26px;font-weight:700}
.cele .meta{margin:4px 0 20px}
.cele .tally{margin-bottom:12px}
.cele p.wk{font-size:17px;font-weight:600}
.streak{display:inline-flex;align-items:center;gap:6px;color:var(--warn);font-weight:600;margin-top:6px}
.cele .btn{margin-top:22px}
.cele-mark{animation:pop .5s var(--ease) both}
.tally i.new{animation:stamp .6s var(--ease) .35s both}
@keyframes pop{from{transform:scale(.5);opacity:0}}
@keyframes stamp{0%{transform:scale(1.6);background:var(--fill2)}60%{transform:scale(.9)}100%{transform:none;background:var(--ac)}}

/* ===== progress ===== */
.stat{display:grid;grid-template-columns:1fr 1fr;padding:14px 16px 4px}
.stat div+div{border-left:.5px solid var(--sep);padding-left:16px}
.stat b{display:block;font-size:30px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.stat small{font-size:13px;color:var(--tx2)}
.heat{padding:14px 16px 12px}
.heat-g{display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(7,auto);grid-auto-flow:column;gap:4px}
.heat-g i{aspect-ratio:1;border-radius:4px;background:var(--fill);display:block}
.heat-g i.t{background:var(--ac)}.heat-g i.g{background:var(--game)}.heat-g i.d{background:var(--ac-soft)}
.heat-g i.fu{background:transparent;box-shadow:inset 0 0 0 1px var(--fill)}
.heat-g i.now{box-shadow:inset 0 0 0 2px var(--tx)}
.heat-m{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;font-size:11px;color:var(--tx2);margin-bottom:4px;height:16px}
.legend{display:flex;gap:14px;font-size:13px;color:var(--tx2);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.bars{display:flex;align-items:flex-end;gap:6px;height:110px;margin-top:10px}
.bars div{flex:1;background:var(--fill2);border-radius:5px 5px 2px 2px;min-height:3px}
.bars div.cur{background:var(--ac)}
.blbl{display:flex;gap:6px;margin-top:6px}.blbl span{flex:1;text-align:center;font-size:11px;color:var(--tx2)}
.spark svg{display:block}
.empty{text-align:center;padding:24px 16px;color:var(--tx2);font-size:15px}
.empty svg.i{width:34px;height:34px;margin-bottom:6px;stroke-width:1.5}
.x{min-height:32px;padding:4px 12px;border-radius:999px;background:var(--fill);color:var(--tx2);font-size:14px;flex:none}
.x.arm{background:var(--bad-soft);color:var(--bad);font-weight:600}
.phases{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:12px}
.phases div{border-radius:10px;padding:8px 6px;text-align:center;font-size:12px;color:var(--tx2);background:var(--fill);line-height:1.35}
.phases div b{display:block;font-size:14px;color:var(--tx);font-weight:600}
.phases div.on{background:var(--ac);color:var(--ac-tx)}.phases div.on b{color:var(--ac-tx)}
.warnline{font-size:13px;color:var(--warn)}
code{font-size:13px;background:var(--fill);padding:2px 5px;border-radius:5px;word-break:break-all}
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
details[open] .chev{transform:rotate(90deg)}

/* ===== onboarding ===== */
.onb{position:fixed;inset:0;background:var(--bg);z-index:65;display:none;overflow-y:auto;padding:calc(10px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom))}
.onb.show{display:block}
.onb-in{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.onb-top{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.onb-top .tally i{width:22px;height:6px;border-radius:3px}
.onb h1{font-size:32px;font-weight:700;line-height:1.25;letter-spacing:-.02em;margin:18px 0 8px}
.onb .lead{font-size:17px;color:var(--tx2);margin-bottom:24px}
.onb .grp{margin-bottom:20px}
.onb .end{margin-top:auto;padding-top:16px}
.mark-logo{width:64px;height:64px;border-radius:16px;background:var(--ac);color:var(--ac-tx);display:grid;place-items:center;margin-top:28px}
.mark-logo svg.i{width:38px;height:38px;stroke-width:1.6}
.swatches{display:flex;gap:14px;flex-wrap:wrap}
.sw-c{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.sw-c svg.i{width:22px;height:22px;stroke-width:2.8;visibility:hidden}
.sw-c[aria-checked="true"]{box-shadow:0 0 0 2px var(--bg),0 0 0 4.5px var(--tx)}
.sw-c[aria-checked="true"] svg.i{visibility:visible}
.preview{display:flex;align-items:center;gap:12px;padding:12px 16px}
.preview .tally{flex:1}
.opt .ok{width:22px;height:22px;color:var(--ac-ink);stroke-width:2.6;visibility:hidden}
.opt[aria-checked="true"] .ok{visibility:visible}

/* ===== random corner overlay ===== */
.rt{position:fixed;inset:0;background:var(--bg);z-index:55;display:none;flex-direction:column;padding:calc(12px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom))}
.rt.show{display:flex}
.rtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rtop .mu{font-size:15px;color:var(--tx2)}
.rtbig{font-size:48px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.net{text-align:center;font-size:13px;color:var(--tx2);margin-top:10px;letter-spacing:.2em}
.court{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr 1fr;gap:3px;margin:6px 0 12px;background:var(--ac);border:3px solid var(--ac);border-radius:6px;max-height:calc(70vh / var(--tz,1))}
.court div{background:var(--cell);display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--tx2);transition:background .1s}
.court div.on{background:var(--ac);color:var(--ac-tx);font-size:30px;font-weight:700}
.rt .hint{text-align:center;font-size:14px;color:var(--tx2)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
